<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>finly — Bank connected</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --ink: #1c1916;
        --muted: #6f675e;
        --card: #fffdf8;
        --line: #e4d8c8;
        --accent: #c45c26;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 17px/1.5 Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Можна повертатися в finly</h1>
      <p id="msg">
        Банк підтвердив доступ. Закрий цю вкладку і в додатку натисни «Синхронізувати».
      </p>
    </main>
    <script>
      const params = new URLSearchParams(location.search || location.hash.replace("#", "?"));
      const code = params.get("code");
      if (code) {
        document.getElementById("msg").textContent =
          "Доступ підтверджено. Повертаю в додаток…";
        location.replace("finly://bank/callback?code=" + encodeURIComponent(code));
      }
    </script>
  </body>
</html>
